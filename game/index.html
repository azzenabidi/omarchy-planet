<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Omarchy Planet</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; }
        #stage { position: fixed; inset: 0; }
        canvas { display: block; }
        #music-toggle {
            position: fixed;
            right: 12px;
            bottom: 10px;
            font: bold 12px monospace;
            color: #00ff88;
            background: #000000;
            border: 1px solid #00ff88;
            padding: 4px 8px;
            cursor: pointer;
            z-index: 100;
            opacity: 0.7;
        }
        #music-toggle:hover { opacity: 1; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <button id="music-toggle">[ MUSIC: ON ]</button>
    <script>
        document.getElementById('music-toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            const muted = Chiptune.toggleMute();
            this.textContent = muted ? '[ MUSIC: OFF ]' : '[ MUSIC: ON ]';
            if (!muted) Chiptune.unlock();
        });
    </script>
